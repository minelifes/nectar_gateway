name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build admin UI (embedded via ui/dist)
        working-directory: ui
        run: npm ci && npm run build
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l $(git ls-files '*.go'))" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 ./...
      - name: build (amd64 + arm64)
        run: |
          CGO_ENABLED=0 GOARCH=amd64 go build -o /dev/null .
          CGO_ENABLED=0 GOARCH=arm64 go build -o /dev/null .
