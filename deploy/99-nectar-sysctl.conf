# /etc/sysctl.d/99-nectar-sysctl.conf — apply with: sudo sysctl --system
# High-throughput tuning for nectar_gateway (16 cores / 32GB)

# accept queue for connection bursts
net.core.somaxconn = 65535
net.ipv4.tcp_max_syn_backlog = 65535
net.core.netdev_max_backlog = 65535

# more ephemeral ports for proxy->backend connections
net.ipv4.ip_local_port_range = 1024 65535
# reuse TIME_WAIT sockets for outgoing connections
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15

# file descriptors
fs.file-max = 2097152

# bigger TCP buffers for high-bandwidth transfers
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216
