name: nectar_mobile
description: Mobile monitor for Nectar Gateway - live backend status and outage notifications.
publish_to: none
version: 1.0.2+2

environment:
  sdk: ">=3.12.0 <4.0.0" # required by flutter_foreground_task 11 (Flutter 3.44+)

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  flutter_local_notifications: ^22.3.2
  workmanager: ^0.10.10
  flutter_foreground_task: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/icon/logo.png
